name: 3D Job Radar

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 3d-job-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELETHON_STRING_SESSION: ${{ secrets.TELETHON_STRING_SESSION }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
      ADDITIONAL_RECIPIENT_CHAT_IDS: ${{ secrets.ADDITIONAL_RECIPIENT_CHAT_IDS }}
      SEND_FREELANCE_VACANCIES: "true"
      SEND_JOB_VACANCIES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Check sources once
        run: python run_once.py
      - name: Persist last seen IDs
        run: |
          if git diff --quiet -- state/last_seen.json state/external_sources.json; then
            echo "State unchanged; no commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- state/last_seen.json state/external_sources.json
            git commit -m "chore: update job radar state"
            git push origin HEAD:main
          fi
